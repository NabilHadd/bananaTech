name: Backend

on: 
  push:
  pull_request:

jobs:
  tests:
    name: Unitary tests
    runs-on: ubuntu-latest
  
    defaults:
      run:
        working-directory: apps/api
    
    steps:
      - name: download code
        uses: actions/checkout@v7
      
      - name: install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: apps/api
          enable-cache: true
      
      - name: install dependencies
        run: uv sync --locked

      - name: run tests
        run: uv run pytest
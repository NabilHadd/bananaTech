[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic-settings>=2.15.0",
    "strawberry-graphql[cli,fastapi]>=0.327.7",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Las comillas en Annotated[...] son obligatorias: strawberry.lazy resuelve el
# tipo en tiempo de ejecución y la clase referenciada no está importada ahí.
"app/*/types.py" = ["UP037"]

name: bananatech

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 5432 del host suele estar tomado por un Postgres local: se expone en 5433.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # La API espera a que esto pase antes de arrancar.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dentro de la red de compose el host de la base es "db", no "localhost",
      # y el puerto es el 5432 interno (no el mapeado al host).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DEBUG: ${DEBUG:-true}
      AUTH_SECRET: ${AUTH_SECRET:-development-only-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PRECIO_DIESEL_CLP_LITRO: ${PRECIO_DIESEL_CLP_LITRO:-1300}
      TARIFA_PEAJES_CLP_KM: ${TARIFA_PEAJES_CLP_KM:-50}
      COSTO_OPERACION_CLP_KM: ${COSTO_OPERACION_CLP_KM:-300}
      TARIFA_VENTA_CLP_TON_KM: ${TARIFA_VENTA_CLP_TON_KM:-250}
      VIATICO_DIARIO_CLP: ${VIATICO_DIARIO_CLP:-15000}
      DESCANSO_MINIMO_HORAS: ${DESCANSO_MINIMO_HORAS:-8}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Código montado desde el host para que --reload funcione.
      - ./apps/api:/app
      # Volumen anónimo: evita que el .venv del host pise el de la imagen.
      - /app/.venv
    command: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

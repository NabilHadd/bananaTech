# Despliegue en Azure: sólo la API. La base es un PostgreSQL externo
# (no un contenedor), así que no hay servicio "db" ni volúmenes de datos.
#
#   docker compose build    # construye y etiqueta la imagen
#   docker compose push     # la sube a Docker Hub
#   docker compose up       # la prueba en local contra la base externa
#
# Otro nombre de proyecto para no chocar con el entorno de desarrollo de main.
name: bananatech-azure

services:
  api:
    build: ./apps/api
    image: nabilhadd/b-tnc:latest
    restart: unless-stopped
    environment:
      # Se define en .env; apunta a la base externa. Con Azure Database for
      # PostgreSQL, asyncpg necesita TLS: agregar ?ssl=require al final.
      DATABASE_URL: ${AZURE_DATABASE_URL:?Define AZURE_DATABASE_URL en .env}
      DEBUG: ${DEBUG:-false}
      # Con DEBUG=false la API no arranca si AUTH_SECRET es el de ejemplo o
      # tiene menos de 32 caracteres.
      AUTH_SECRET: ${AUTH_SECRET:?Define AUTH_SECRET en .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PRECIO_DIESEL_CLP_LITRO: ${PRECIO_DIESEL_CLP_LITRO:-1300}
      TARIFA_PEAJES_CLP_KM: ${TARIFA_PEAJES_CLP_KM:-50}
      COSTO_OPERACION_CLP_KM: ${COSTO_OPERACION_CLP_KM:-300}
      TARIFA_VENTA_CLP_TON_KM: ${TARIFA_VENTA_CLP_TON_KM:-250}
      VIATICO_DIARIO_CLP: ${VIATICO_DIARIO_CLP:-15000}
      DESCANSO_MINIMO_HORAS: ${DESCANSO_MINIMO_HORAS:-8}
    ports:
      - "${API_PORT:-8000}:8000"
    # Sin bind mount ni --reload: corre el código copiado en la imagen, igual
    # que en Azure.
    command: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000
